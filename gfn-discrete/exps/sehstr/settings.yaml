# run
setting: 'sehstr'
device: 'cuda'

# wandb
wandb_mode: 'online'   # 'online', 'disabled'
wandb_project: 'sehstr'
exp_name: ''

# model learning
model: 'tb' # choices=['sub', 'maxent', 'random', 'tb', 'db', 'subtb']
sa_or_ssr: 'ssr'
lr_z: 1.0e-1
lr_policy: 1.0e-4
lr_critic: 1.0e-4
lr_logF: 1.0e-4
clip_policy_logit_min: -50.0
clip_policy_logit_max: 50.0
clip_grad_norm: 10.0
clip_param: 0.2
entropy_coef: 0.01
sql_alpha: 0.01
lamda: 0.9

# IW training
iw_training: False
alternate: False

# Prioritized Buffer
prioritization: 'none'  # choices=['reward', 'loss', 'iw', 'normalized_iw','none']
buffer_sampling: 'systematic'  # choices=['multinomial', 'stratified', 'systematic', 'rank']
rank_k: 0.01
target_ess: 0.05
smoothing_strategy: 'temper'  # choices=['temper', 'clip_above', 'clip_below']

# model architecture
# inp_dim is specified by mdp
ssr_encoder_hid_dim: 1024
ssr_encoder_n_layers: 1
ssr_embed_dim: 1024
ssr_scorer_hid_dim: 1024
ssr_scorer_n_layers: 1
sa_hid_dim: 1024
sa_n_layers: 2

# trainer
num_active_learning_rounds: 2000
num_samples_per_online_batch: 100
num_samples_per_offline_batch: 100

online_num_steps_per_batch: 1
offline_num_steps_per_batch: 1
num_online_batches_per_round: 1
num_offline_batches_per_round: 2

# policy
explore_epsilon: 0.0

# experiment
replicate: 0
saved_models_dir: 'saved_models/sehstr/'
save_every_x_active_rounds: 500
eval_every_x_active_rounds: 50

# reward
scale_reward_min: 0.001
scale_reward_max: 10
beta: 20

# experiment-specific settings
blocks_file: datasets/sehstr/block_18.json
mode_info_file: datasets/sehstr/mode_info.pkl
mode_metric: tanimoto
mode_percentile: 0.0001
mode_div_threshold: 0.4
forced_stop_len: 6

# local search related arguments
ls: false
deterministic: false
k: 3
i: 7

# checkpointing
ckpt: -1
eval_num_samples: 10000

# reproduction
seed: 0

# replay buffer
replay_buffer_size: 100000

# GAFN

reward_scale: 1.0


# PER

per: False

teacher_beta: 10.0

teacher_ratio: 0.75

alpha: 0.5